model: gpt-5-mini
description: >-
  Especialista em dados e analytics de Servicos Financeiros: credito (ECL/PD/LGD),
  AML/KYC, IFRS 9, churn, next best offer e Open Finance.
guardrail: gr-industry-regulado
# Forca o uso do File Search. A doc indica isso como solucao para
# "No citations in response": "Use tool_choice='required' to force file search."
