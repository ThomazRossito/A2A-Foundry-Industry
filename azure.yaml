# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'

name: ai-agents-foundry

services:
  ai-project:
    host: azure.ai.project
    # Modelo gpt-5-mini ja deployado manualmente no projeto ai-multi-agents (eastus2).
    # Sem provisionamento de modelo via azd, para nao tentar criar deployment sem cota.

  supervisor-industry:
    host: azure.ai.agent
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Industry Knowledge Base
    project: src/supervisor
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
    kind: hosted
    name: supervisor-industry
    description: >-
      Supervisor de Industria: roteia perguntas de dados e analytics para uma de
      10 verticais de industria e responde fundamentado exclusivamente na
      Knowledge Base da vertical (protocolo KB-First).
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: gpt-5-mini
    container:
      resources:
        cpu: '1.0'
        memory: 2.0Gi

infra:
  provider: microsoft.foundry
